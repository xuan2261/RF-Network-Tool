name: RF Network Tool CI

on:
  push:
    branches: [main]
    tags: [v1.4.2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rft-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Static + deterministic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fL --retry 3 --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" "$url"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Compile Python tests
        run: python -m compileall -q tests release_tools
      - name: Run active static/model suite
        run: python tests/run_all_static_v1_4_2.py
      - name: Validate CI workflow contracts
        run: python tests/ci_workflow_contract_v1_4_2.py
      - name: Ensure tests do not mutate tracked source
        run: git diff --exit-code

  windows-runtime:
    name: Windows PS5.1 integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runtime integration on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\WINDOWS_INTEGRATION_TEST_v1_4_2.ps1
      - name: Install pinned PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer gate
        shell: powershell
        run: .\tests\WINDOWS_LINT_GATE_v1_4_2.ps1
      - name: Chaos and recovery qualification
        shell: powershell
        run: .\tests\WINDOWS_CHAOS_TEST_v1_4_2.ps1
      - name: Synthetic performance qualification
        shell: powershell
        run: .\tests\WINDOWS_PERFORMANCE_TEST_v1_4_2.ps1
      - name: Launcher diagnostic E2E
        shell: powershell
        run: .\tests\WINDOWS_LAUNCHER_E2E_v1_4_2.ps1 -DiagnosticOnly
      - name: Real-machine qualification harness SAFE smoke
        if: matrix.os == 'windows-2022'
        shell: powershell
        run: |
          $winps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'

          # Force the first pass through the harness installer path while the
          # parent PowerShell still has a clean module path.
          Get-InstalledModule PSScriptAnalyzer -AllVersions -ErrorAction SilentlyContinue |
            ForEach-Object { Uninstall-Module -Name $_.Name -RequiredVersion $_.Version -Force -ErrorAction SilentlyContinue }

          # Then reproduce the real-machine failure mode: Windows PowerShell
          # is launched from a process whose PSModulePath is polluted by PS7.
          $ps7Modules = Join-Path $env:ProgramFiles 'PowerShell\7\Modules'
          $env:PSModulePath = $ps7Modules + ';' + $env:PSModulePath

          Write-Host "SAFE harness stress pass 1/2 (installer path)"
          & $winps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RF-Network-Tool-RealMachineQualification.ps1 -Mode Safe -AllowModuleInstall -NoZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "SAFE harness stress pass 2/2 (reuse installed analyzer)"
          & $winps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RF-Network-Tool-RealMachineQualification.ps1 -Mode Safe -NoZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-${{ matrix.os }}
          path: |
            ci-artifacts/**
            logs/**
            real-machine-results/**
          if-no-files-found: ignore

  package:
    name: Reproducible release package
    needs: [static-contracts, windows-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RFT_WINDOWS_RUNTIME_VERIFIED: '1'
      RFT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build release zips
        run: python release_tools/build_release_v1_4_2.py
      - name: Package integrity tests
        run: python tests/release_package_test_v1_4_2.py
      - name: Byte reproducibility test
        run: python tests/reproducible_package_test_v1_4_2.py
      - name: Stage release candidates inside workspace
        run: |
          mkdir -p ci-artifacts/release
          cp ../RF-Network-Tool-v1.4.2-FULL-QA-CI-E2E-PROJECT.zip ci-artifacts/release/
          cp ../RF-Network-Tool-v1.4.2-FULL-QA-CI-E2E-PORTABLE.zip ci-artifacts/release/
      - name: Attest release candidates
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'ci-artifacts/release/*.zip'
      - name: Verify release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in ci-artifacts/release/*.zip; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$f" -R "$GITHUB_REPOSITORY"; then ok=1; break; fi
              sleep 3
            done
            test "$ok" -eq 1
          done
      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rf-network-tool-v1.4.2
          path: ci-artifacts/release/*.zip
          if-no-files-found: error


  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.4.2'
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified release candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rf-network-tool-v1.4.2
          path: release-assets
      - name: Build public checksum file
        run: |
          cd release-assets
          sha256sum *.zip | sort > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
      - name: Publish or refresh v1.4.2 release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.4.2
        run: |
          set -euo pipefail
          expected=(
            "RF-Network-Tool-v1.4.2-FULL-QA-CI-E2E-PORTABLE.zip"
            "RF-Network-Tool-v1.4.2-FULL-QA-CI-E2E-PROJECT.zip"
            "SHA256SUMS.txt"
          )
          for f in "${expected[@]}"; do test -s "release-assets/$f"; done

          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            if [ "$release_sha" != "$GITHUB_SHA" ]; then
              echo "Refusing to overwrite $RELEASE_TAG: tag resolves to $release_sha, current commit is $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY"               --title "RF & Network Diagnostic Tool v1.4.2 — Full QA / CI-E2E"               --notes-file RELEASE_NOTES_v1.4.2.md               --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* -R "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "RF & Network Diagnostic Tool v1.4.2 — Full QA / CI-E2E"               --notes-file RELEASE_NOTES_v1.4.2.md               --latest
          fi

          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY"             --json tagName,isDraft,isPrerelease,assets,url > release-assets/release-view.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("release-assets/release-view.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          names={a["name"] for a in d["assets"]}
          expected={
              "RF-Network-Tool-v1.4.2-FULL-QA-CI-E2E-PORTABLE.zip",
              "RF-Network-Tool-v1.4.2-FULL-QA-CI-E2E-PROJECT.zip",
              "SHA256SUMS.txt",
          }
          missing=expected-names
          assert d["tagName"]=="v1.4.2", d
          assert d["isDraft"] is False, d
          assert d["isPrerelease"] is False, d
          assert not missing, f"Missing release assets: {sorted(missing)}"
          print("RELEASE ASSET VERIFICATION PASSED:", ", ".join(sorted(expected)))
          PY
      - name: Upload release publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-publication-evidence
          path: |
            release-assets/SHA256SUMS.txt
            release-assets/release-view.json
          if-no-files-found: ignore
