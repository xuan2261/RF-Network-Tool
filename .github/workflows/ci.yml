name: RF Network Tool CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rft-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Static + deterministic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fL --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" "$url"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Compile Python tests
        run: python -m compileall -q tests release_tools
      - name: Run active static/model suite
        run: python tests/run_all_static_v1_4_2.py
      - name: Validate CI workflow contracts
        run: python tests/ci_workflow_contract_v1_4_2.py
      - name: Ensure tests do not mutate tracked source
        run: git diff --exit-code

  windows-runtime:
    name: Windows PS5.1 integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runtime integration on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\WINDOWS_INTEGRATION_TEST_v1_4_2.ps1
      - name: Evidence sanitizer IPv6 self-test
        shell: powershell
        run: .\RF-Network-Tool-RealMachineQualification.ps1 -SanitizerSelfTest -NoZip
      - name: Route-aware scope planner policy
        shell: powershell
        run: .\tests\WINDOWS_ROUTE_SCOPE_TEST_v1_5_1.ps1
      - name: Install pinned PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer gate
        shell: powershell
        run: .\tests\WINDOWS_LINT_GATE_v1_4_2.ps1
      - name: Chaos and recovery qualification
        shell: powershell
        run: .\tests\WINDOWS_CHAOS_TEST_v1_4_2.ps1
      - name: Synthetic performance qualification
        shell: powershell
        run: .\tests\WINDOWS_PERFORMANCE_TEST_v1_4_2.ps1
      - name: Tab accessibility MSAA fallback self-test
        shell: powershell
        run: .\tests\WINDOWS_LAUNCHER_E2E_v1_4_2.ps1 -AccessibilitySelfTest
      - name: Launcher diagnostic E2E
        shell: powershell
        run: .\tests\WINDOWS_LAUNCHER_E2E_v1_4_2.ps1 -DiagnosticOnly
      - name: Machine cleanliness fail-closed qualification
        shell: powershell
        run: .\tests\WINDOWS_MACHINE_CLEANLINESS_TEST_v1_4_2.ps1
      - name: Real-machine qualification harness SAFE smoke
        if: matrix.os == 'windows-2022'
        shell: powershell
        run: |
          $winps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'

          # Force the first pass through the harness installer path while the
          # parent PowerShell still has a clean module path.
          Get-InstalledModule PSScriptAnalyzer -AllVersions -ErrorAction SilentlyContinue |
            ForEach-Object { Uninstall-Module -Name $_.Name -RequiredVersion $_.Version -Force -ErrorAction SilentlyContinue }

          # Then reproduce the real-machine failure mode: Windows PowerShell
          # is launched from a process whose PSModulePath is polluted by PS7.
          $ps7Modules = Join-Path $env:ProgramFiles 'PowerShell\7\Modules'
          $env:PSModulePath = $ps7Modules + ';' + $env:PSModulePath

          Write-Host "SAFE harness stress pass 1/2 (installer path)"
          & $winps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RF-Network-Tool-RealMachineQualification.ps1 -Mode Safe -AllowModuleInstall -NoZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "SAFE harness stress pass 2/2 (reuse installed analyzer)"
          & $winps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RF-Network-Tool-RealMachineQualification.ps1 -Mode Safe -NoZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-${{ matrix.os }}
          path: |
            ci-artifacts/**
            logs/**
            real-machine-results/**
          if-no-files-found: ignore

  package:
    name: Reproducible release package
    needs: [static-contracts, windows-runtime]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RFT_WINDOWS_RUNTIME_VERIFIED: '1'
      RFT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "artifact_name=rf-network-tool-v$version"
          } >> "$GITHUB_OUTPUT"
      - name: Build release zips
        run: python release_tools/build_release.py
      - name: Package integrity tests
        run: python tests/release_package_test_v1_4_2.py
      - name: Release SBOM integrity tests
        run: python tests/release_sbom_test_v1_4_2.py
      - name: Byte reproducibility test
        run: python tests/reproducible_package_test_v1_4_2.py
      - name: Stage release candidates inside workspace
        run: |
          mkdir -p ci-artifacts/release
          version="${{ steps.version.outputs.version }}"
          cp "../RF-Network-Tool-v${version}-FULL-QA-CI-E2E-PROJECT.zip" ci-artifacts/release/
          cp "../RF-Network-Tool-v${version}-FULL-QA-CI-E2E-PORTABLE.zip" ci-artifacts/release/
          cp "../RF-Network-Tool-v${version}-FULL-QA-CI-E2E-PROJECT.spdx.json" ci-artifacts/release/
          cp "../RF-Network-Tool-v${version}-FULL-QA-CI-E2E-PORTABLE.spdx.json" ci-artifacts/release/
      - name: Attest release candidates
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'ci-artifacts/release/*.zip'
      - name: Attest project ZIP SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'ci-artifacts/release/RF-Network-Tool-v${{ steps.version.outputs.version }}-FULL-QA-CI-E2E-PROJECT.zip'
          sbom-path: 'ci-artifacts/release/RF-Network-Tool-v${{ steps.version.outputs.version }}-FULL-QA-CI-E2E-PROJECT.spdx.json'
      - name: Attest portable ZIP SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'ci-artifacts/release/RF-Network-Tool-v${{ steps.version.outputs.version }}-FULL-QA-CI-E2E-PORTABLE.zip'
          sbom-path: 'ci-artifacts/release/RF-Network-Tool-v${{ steps.version.outputs.version }}-FULL-QA-CI-E2E-PORTABLE.spdx.json'
      - name: Verify release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in ci-artifacts/release/*.zip; do
            ok=0
            for _ in 1 2 3 4 5; do
              if gh attestation verify "$f" -R "$GITHUB_REPOSITORY"; then ok=1; break; fi
              sleep 3
            done
            test "$ok" -eq 1
          done
          for f in ci-artifacts/release/*.zip; do
            ok=0
            for _ in 1 2 3 4 5; do
              if gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3; then ok=1; break; fi
              sleep 3
            done
            test "$ok" -eq 1
          done
      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ci-artifacts/release/*.zip
            ci-artifacts/release/*.spdx.json
          if-no-files-found: error


  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag against VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          expected_tag="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag/version mismatch: tag=$GITHUB_REF_NAME VERSION=$version expected=$expected_tag" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$expected_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Download verified release candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-assets
      - name: Build public checksum file
        run: |
          cd release-assets
          sha256sum -- *.zip *.spdx.json | sort > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4
      - name: Create draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "RF-Network-Tool-v${RELEASE_VERSION}-FULL-QA-CI-E2E-PORTABLE.zip"
            "RF-Network-Tool-v${RELEASE_VERSION}-FULL-QA-CI-E2E-PROJECT.zip"
            "RF-Network-Tool-v${RELEASE_VERSION}-FULL-QA-CI-E2E-PORTABLE.spdx.json"
            "RF-Network-Tool-v${RELEASE_VERSION}-FULL-QA-CI-E2E-PROJECT.spdx.json"
            "SHA256SUMS.txt"
          )
          for f in "${expected[@]}"; do test -s "release-assets/$f"; done

          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $RELEASE_TAG" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" release-assets/* -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RF & Network Diagnostic Tool ${RELEASE_TAG} — Full QA / CI-E2E" \
            --notes-file RELEASE_NOTES.md \
            --draft

          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets,url > release-assets/release-view-draft.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          version=os.environ['RELEASE_VERSION']; tag=os.environ['RELEASE_TAG']
          d=json.loads(Path('release-assets/release-view-draft.json').read_text(encoding='utf-8'))
          names={a['name'] for a in d['assets']}
          expected={
              f'RF-Network-Tool-v{version}-FULL-QA-CI-E2E-PORTABLE.zip',
              f'RF-Network-Tool-v{version}-FULL-QA-CI-E2E-PROJECT.zip',
              f'RF-Network-Tool-v{version}-FULL-QA-CI-E2E-PORTABLE.spdx.json',
              f'RF-Network-Tool-v{version}-FULL-QA-CI-E2E-PROJECT.spdx.json',
              'SHA256SUMS.txt',
          }
          assert d['tagName']==tag, d
          assert d['isDraft'] is True, d
          assert d['isPrerelease'] is False, d
          assert not (expected-names), f'Missing draft release assets: {sorted(expected-names)}'
          print('DRAFT RELEASE ASSET VERIFICATION PASSED:', ', '.join(sorted(expected)))
          PY

          gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets,url > release-assets/release-view.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          version=os.environ['RELEASE_VERSION']; tag=os.environ['RELEASE_TAG']
          d=json.loads(Path('release-assets/release-view.json').read_text(encoding='utf-8'))
          names={a['name'] for a in d['assets']}
          expected={
              f'RF-Network-Tool-v{version}-FULL-QA-CI-E2E-PORTABLE.zip',
              f'RF-Network-Tool-v{version}-FULL-QA-CI-E2E-PROJECT.zip',
              f'RF-Network-Tool-v{version}-FULL-QA-CI-E2E-PORTABLE.spdx.json',
              f'RF-Network-Tool-v{version}-FULL-QA-CI-E2E-PROJECT.spdx.json',
              'SHA256SUMS.txt',
          }
          assert d['tagName']==tag, d
          assert d['isDraft'] is False, d
          assert d['isPrerelease'] is False, d
          assert not (expected-names), f'Missing release assets: {sorted(expected-names)}'
          print('RELEASE ASSET VERIFICATION PASSED:', ', '.join(sorted(expected)))
          PY
      - name: Upload release publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-publication-evidence-${{ steps.version.outputs.version }}
          path: |
            release-assets/SHA256SUMS.txt
            release-assets/release-view-draft.json
            release-assets/release-view.json
          if-no-files-found: ignore

