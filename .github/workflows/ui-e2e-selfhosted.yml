name: RF Network Tool Physical Qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to qualify
        required: true
        type: string
      interface_index:
        description: Optional physical adapter InterfaceIndex; blank = auto-detect
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: rft-physical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  physical-qualification:
    name: WinForms + real-LAN physical qualification
    runs-on: [self-hosted, Windows, X64, rft-interactive]
    timeout-minutes: 20
    env:
      RFT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RFT_INTERFACE_INDEX: ${{ inputs.interface_index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exact revision guard
        shell: powershell
        run: |
          Remove-Item -LiteralPath .\real-machine-results -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath .\ci-artifacts -Recurse -Force -ErrorAction SilentlyContinue
          $actual=(git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected=([string]$env:RFT_EXPECTED_SHA).Trim().ToLowerInvariant()
          if($expected -notmatch '^[0-9a-f]{40}$'){throw 'expected_sha must be an exact 40-character commit SHA.'}
          if($actual -ne $expected){throw "Revision mismatch: checkout=$actual expected=$expected"}
          New-Item -ItemType Directory -Path .\ci-artifacts\physical-safe -Force | Out-Null
          $actual | Set-Content -LiteralPath .\ci-artifacts\physical-safe\qualification-revision.txt -Encoding ASCII

      - name: Interactive desktop preflight
        shell: powershell
        run: .\tests\WINDOWS_INTERACTIVE_PREFLIGHT_v1_4_2.ps1

      - name: Run full physical qualification
        shell: powershell
        run: |
          $winps=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $invokeArgs=@(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass',
            '-File','.\RF-Network-Tool-RealMachineQualification.ps1',
            '-Mode','Full','-AllowModuleInstall','-NoZip',
            '-ExpectedSourceRevision',$env:RFT_EXPECTED_SHA
          )
          if(-not [string]::IsNullOrWhiteSpace($env:RFT_INTERFACE_INDEX)){
            if($env:RFT_INTERFACE_INDEX -notmatch '^[1-9]\d*$'){throw 'interface_index must be a positive numeric InterfaceIndex.'}
            $invokeArgs += @('-InterfaceIndex',$env:RFT_INTERFACE_INDEX)
          }
          & $winps @invokeArgs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Stage safe evidence and assert required physical gates
        if: always()
        shell: powershell
        run: |
          $safeDir=Join-Path $PWD 'ci-artifacts\physical-safe'
          New-Item -ItemType Directory -Path $safeDir -Force | Out-Null
          $summary=Get-ChildItem -LiteralPath .\real-machine-results -Filter summary.json -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $summary){throw 'Physical qualification summary.json was not produced.'}
          $data=[IO.File]::ReadAllText($summary.FullName) | ConvertFrom-Json
          $deepEvidencePath=Join-Path $PWD 'ci-artifacts\deep-ui-e2e.json'
          if(-not (Test-Path -LiteralPath $deepEvidencePath)){throw 'deep-ui-e2e.json was not produced.'}
          $deepEvidence=[IO.File]::ReadAllText($deepEvidencePath) | ConvertFrom-Json
          $measurement=$data.results | Where-Object {$_.name -eq 'measurement_correctness'} | Select-Object -First 1
          $measurementPath=Join-Path $PWD 'ci-artifacts\measurement-correctness.json'
          if(-not (Test-Path -LiteralPath $measurementPath)){throw 'Native measurement evidence missing'}
          $measurementEvidence=[IO.File]::ReadAllText($measurementPath)|ConvertFrom-Json -ErrorAction Stop
          Copy-Item -LiteralPath $measurementPath -Destination (Join-Path $safeDir 'measurement-correctness.json') -Force
          if(-not $measurement -or [string]$measurement.status -ne 'PASS' -or [string]$measurementEvidence.status -ne 'PASS' -or [int]$measurementEvidence.fail -ne 0){throw 'Native measurement gate must independently PASS'}
          $actual=(git rev-parse HEAD).Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $actual -notmatch '^[0-9a-f]{40}$'){throw 'Cannot resolve physical checkout revision'}
          if([string]$measurementEvidence.sourceRevision -ne $actual){throw 'Native measurement evidence revision mismatch'}
          $requiredMeasurement=@('duration_36h','measurement_error_not_network_loss','sequence_exact_math','reset_epoch_rejects_old','worker_stop_health','discovery_early_window','discovery_cancel_distinct','real_grid_headers_font_scale_1','real_grid_headers_font_scale_2','invariant_observation_vi-VN')
          $measurementChecks=@($measurementEvidence.checks)
          if(@($measurementChecks | Where-Object {$_.pass -isnot [bool] -or -not $_.pass}).Count -gt 0){throw 'Native measurement detail contains a failed or malformed check'}
          foreach($requiredCheck in $requiredMeasurement){
            if(@($measurementChecks | Where-Object {$_.name -eq $requiredCheck}).Count -ne 1){throw "Native measurement required check missing or duplicated: $requiredCheck"}
          }
          $gui=$data.results | Where-Object {$_.name -eq 'interactive_gui_e2e'} | Select-Object -First 1
          $deepUi=$data.results | Where-Object {$_.name -eq 'deep_ui_e2e'} | Select-Object -First 1
          $routePlanner=$data.results | Where-Object {$_.name -eq 'route_scope_planner'} | Select-Object -First 1
          $routeLive=$data.results | Where-Object {$_.name -eq 'route_scope_live'} | Select-Object -First 1
          $lan=$data.results | Where-Object {$_.name -eq 'real_lan_fast_balanced'} | Select-Object -First 1
          $cleanBaseline=$data.results | Where-Object {$_.name -eq 'machine_cleanliness_baseline'} | Select-Object -First 1
          $cleanPost=$data.results | Where-Object {$_.name -eq 'machine_cleanliness_post'} | Select-Object -First 1
          $safe=[ordered]@{
            schemaVersion=1
            sourceRevision=$actual
            harnessSourceRevision=[string]$data.sourceRevision
            mode=[string]$data.mode
            interactiveGui=if($gui){[string]$gui.status}else{'MISSING'}
            measurementCorrectness=[string]$measurementEvidence.status
            deepUi=if($deepUi){[string]$deepUi.status}else{'MISSING'}
            deepUiEvidenceStatus=[string]$deepEvidence.status
            deepUiEvidenceStage=[string]$deepEvidence.stage
            routeScopePlanner=if($routePlanner){[string]$routePlanner.status}else{'MISSING'}
            routeScopeLive=if($routeLive){[string]$routeLive.status}else{'MISSING'}
            realLanFastBalanced=if($lan){[string]$lan.status}else{'MISSING'}
            machineCleanlinessBaseline=if($cleanBaseline){[string]$cleanBaseline.status}else{'MISSING'}
            machineCleanlinessPost=if($cleanPost){[string]$cleanPost.status}else{'MISSING'}
            pass=[int]$data.pass
            fail=[int]$data.fail
            skip=[int]$data.skip
          }
          $safe | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $safeDir 'physical-qualification-summary.json') -Encoding UTF8
          if(Test-Path -LiteralPath .\ci-artifacts\ui-tab-items.txt){
            Copy-Item -LiteralPath .\ci-artifacts\ui-tab-items.txt -Destination (Join-Path $safeDir 'ui-tab-items.txt') -Force
          }
          if(Test-Path -LiteralPath .\ci-artifacts\route-aware-live-summary.json){
            Copy-Item -LiteralPath .\ci-artifacts\route-aware-live-summary.json -Destination (Join-Path $safeDir 'route-aware-live-summary.json') -Force
          }
          if(Test-Path -LiteralPath .\ci-artifacts\deep-ui-e2e.json){
            Copy-Item -LiteralPath .\ci-artifacts\deep-ui-e2e.json -Destination (Join-Path $safeDir 'deep-ui-e2e.json') -Force
          }
          if([string]$data.sourceRevision -ne $actual){throw "Harness source revision mismatch: summary=$($data.sourceRevision) checkout=$actual"}
          if([string]$data.mode -ne 'Full'){throw "Expected Full mode, got $($data.mode)"}
          if(-not $gui -or [string]$gui.status -ne 'PASS'){throw 'interactive_gui_e2e must PASS.'}
          if(-not $deepUi -or [string]$deepUi.status -ne 'PASS'){throw 'deep_ui_e2e must PASS; the Device Details deep-analysis button path is release-critical.'}
          if([string]$deepEvidence.status -ne 'PASS' -or [string]$deepEvidence.stage -ne 'completed'){throw "deep-ui-e2e.json must independently report PASS/completed; got status=$($deepEvidence.status) stage=$($deepEvidence.stage)."}
          if(-not [bool]$deepEvidence.workerCompleted -or -not [bool]$deepEvidence.workerSucceeded){throw 'deep-ui-e2e.json must prove workerCompleted=true and workerSucceeded=true.'}
          if([string]$deepEvidence.lastPhase -ne 'Completed'){throw "deep-ui-e2e.json unexpected lastPhase=$($deepEvidence.lastPhase)."}
          if(-not $routePlanner -or [string]$routePlanner.status -ne 'PASS'){throw 'route_scope_planner must PASS.'}
          if(-not $routeLive -or [string]$routeLive.status -ne 'PASS'){throw 'route_scope_live must PASS; SKIP is not release qualification.'}
          if(-not $lan -or [string]$lan.status -ne 'PASS'){throw 'real_lan_fast_balanced must PASS; SKIP is not release qualification.'}
          if(-not $cleanBaseline -or [string]$cleanBaseline.status -ne 'PASS'){throw 'machine_cleanliness_baseline must PASS.'}
          if(-not $cleanPost -or [string]$cleanPost.status -ne 'PASS'){throw 'machine_cleanliness_post must PASS.'}
          if([int]$data.fail -ne 0){throw "Physical qualification recorded $($data.fail) failure(s)."}
          if(-not (Test-Path -LiteralPath (Join-Path $safeDir 'ui-tab-items.txt'))){throw 'ui-tab-items.txt evidence is missing.'}
          if(-not (Test-Path -LiteralPath (Join-Path $safeDir 'route-aware-live-summary.json'))){throw 'route-aware-live-summary.json evidence is missing.'}
          if(-not (Test-Path -LiteralPath (Join-Path $safeDir 'deep-ui-e2e.json'))){throw 'deep-ui-e2e.json evidence is missing.'}
          Write-Host 'PHYSICAL QUALIFICATION REQUIRED GATES PASSED'

      - name: Remove raw physical-network evidence
        if: always()
        shell: powershell
        run: |
          Remove-Item -LiteralPath .\real-machine-results -Recurse -Force -ErrorAction SilentlyContinue
          if(Test-Path -LiteralPath .\ci-artifacts){
            Get-ChildItem -LiteralPath .\ci-artifacts -Force |
              Where-Object {$_.Name -ne 'physical-safe'} |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload sanitized physical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: physical-qualification-evidence
          path: ci-artifacts/physical-safe/**
          if-no-files-found: warn
