name: Measurement hardening preflight
on:
  push:
    branches: [work/v1.5.3-measurement-preflight]
permissions:
  contents: read
concurrency:
  group: rft-measurement-preflight
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Normalize checkout and prepare guarded patch
        shell: powershell
        run: |
          git config core.autocrlf false
          git checkout-index --all --force
          python .rft-preflight/prepare.py prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce two defects in original production functions
        shell: powershell
        run: |
          & .\.rft-preflight\baseline-test.ps1 -Root $PWD.Path -BaselineRed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply hash-guarded candidate
        shell: powershell
        run: |
          python .rft-preflight/prepare.py apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Refine native interfaces and independently test physical evidence validation
        shell: powershell
        run: |
          @'
          import hashlib,json
          from pathlib import Path
          fixes=json.loads(r'''[{"path":"RF-Network-Tool-Portable.ps1","before":"973dcae9873284a973b1f69e537a59cfcf1a1dffd67b2a8fbce0fc6c406cded6","after":"e8a5bd34dd106871e7786c42049115420e034794a704a9eb2cf694c9f3a60058","replacements":[["New-MonitorRequestStamp","Get-MonitorRequestStamp"],["function Set-MonitorMeasurementError([string]$target,[string]$message) {\n    if(-not $script:MonitoringStats.ContainsKey($target)){return}","function Set-MonitorMeasurementError {\n    [CmdletBinding(SupportsShouldProcess=$true,ConfirmImpact='Low')]\n    param([string]$target,[string]$message)\n    if(-not $script:MonitoringStats.ContainsKey($target)){return}\n    if(-not $PSCmdlet.ShouldProcess($target,'Record local measurement error')){return}"],["[double]::TryParse([string]$result.Time,[ref]$ms)","[double]::TryParse([string]$result.Time,[Globalization.NumberStyles]::Float,[Globalization.CultureInfo]::InvariantCulture,[ref]$ms)"],["[double]::TryParse([string]$result.ObservedMono,[ref]$sampleMono)","[double]::TryParse([string]$result.ObservedMono,[Globalization.NumberStyles]::Float,[Globalization.CultureInfo]::InvariantCulture,[ref]$sampleMono)"],["[double]::TryParse([string]$result.windowElapsedMs,[ref]$ms)","[double]::TryParse([string]$result.windowElapsedMs,[Globalization.NumberStyles]::Float,[Globalization.CultureInfo]::InvariantCulture,[ref]$ms)"]]},{"path":"tests/WINDOWS_MEASUREMENT_TEST_v1_5_3.ps1","before":"026037a85c4c249fb5f376358a0ae66516d78a7950519a6e8915f55a27ee66b4","after":"fdd34816170a835c3106ce015a8a8b87adf30e49e961e449256ee9293ecdc97c","replacements":[["New-MonitorRequestStamp","Get-MonitorRequestStamp"],["        Check 'invalid_sample_not_counted' ($st.TotalCount -eq $count -and $st.MeasurementErrorCount -eq 1)","        Check 'invalid_sample_not_counted' ($st.TotalCount -eq $count -and $st.MeasurementErrorCount -eq 1)\n        $priorCulture=[Threading.Thread]::CurrentThread.CurrentCulture\n        try {\n            foreach($culture in @('en-US','fr-FR','vi-VN')){\n                [Threading.Thread]::CurrentThread.CurrentCulture=[Globalization.CultureInfo]::GetCultureInfo($culture)\n                Fresh;Tick 0.25;Sample $true 1.5;Tick 5;Sample $true 2.5\n                $st=$script:MonitoringStats['192.0.2.1']\n                Check ('invariant_observation_'+$culture) ($st.SuccessCount -eq 2 -and $st.SumMs -eq 4 -and $st.LastSampleMono -eq 105.25 -and $st.MeasurementErrorCount -eq 0)\n            }\n        } finally {[Threading.Thread]::CurrentThread.CurrentCulture=$priorCulture}\n        Fresh;Sample $true 4;Tick\n        Set-MonitorMeasurementError -target '192.0.2.1' -message 'not applied' -WhatIf\n        Check 'measurement_error_whatif_no_mutation' ($script:MonitoringStats['192.0.2.1'].MeasurementErrorCount -eq 0 -and $script:MonitoringStats['192.0.2.1'].CollectorHealth -eq 'OK')"]]},{"path":"RF-Network-Tool-Portable.ps1","before":"e8a5bd34dd106871e7786c42049115420e034794a704a9eb2cf694c9f3a60058","after":"cb18259caf18a65a6efa3855410290529346334d27c9d239f625c7085f0a7c43","replacements":[["$sample=if($column.Name -in @('MonLastSample','MonChanged'))","$sample=if($column.Name -eq 'MonState'){'ENGINE ERROR'}elseif($column.Name -in @('MonLastSample','MonChanged'))"]]},{"path":".github/workflows/ui-e2e-selfhosted.yml","before":"50bddf9b1c86bf4b4d478400b3ae9f517357819e0deaeddc62d231e747219774","after":"2d687e5eb60099276223e36a857d582da84e9b6f46f1e2f7877a49801cd6d8dd","replacements":[["          if([string]$measurementEvidence.sourceRevision -ne $actual){throw 'Native measurement evidence revision mismatch'}","          $actual=(git rev-parse HEAD).Trim().ToLowerInvariant()\n          if($LASTEXITCODE -ne 0 -or $actual -notmatch '^[0-9a-f]{40}$'){throw 'Cannot resolve physical checkout revision'}\n          if([string]$measurementEvidence.sourceRevision -ne $actual){throw 'Native measurement evidence revision mismatch'}\n          $requiredMeasurement=@('duration_36h','measurement_error_not_network_loss','sequence_exact_math','reset_epoch_rejects_old','worker_stop_health','discovery_early_window','discovery_cancel_distinct','real_grid_headers_font_scale_1','real_grid_headers_font_scale_2','invariant_observation_vi-VN')\n          $measurementChecks=@($measurementEvidence.checks)\n          if(@($measurementChecks | Where-Object {$_.pass -isnot [bool] -or -not $_.pass}).Count -gt 0){throw 'Native measurement detail contains a failed or malformed check'}\n          foreach($requiredCheck in $requiredMeasurement){\n            if(@($measurementChecks | Where-Object {$_.name -eq $requiredCheck}).Count -ne 1){throw \"Native measurement required check missing or duplicated: $requiredCheck\"}\n          }"],["          $actual=(git rev-parse HEAD).Trim().ToLowerInvariant()\n          $safe=[ordered]@{","          $safe=[ordered]@{"]]},{"path":"tests/WINDOWS_MEASUREMENT_TEST_v1_5_3.ps1","before":"fdd34816170a835c3106ce015a8a8b87adf30e49e961e449256ee9293ecdc97c","after":"898713e9079b8e75fd556ea6b4b74e5a14492f468ca4988c55ea226a21e36bca","replacements":[["        Check 'details_adapter_getter_no_ui_side_effects' ($txtCidr.Text -eq '198.51.100.0/28' -and $lblScanStatus.Text -eq 'Previous result')","        Check 'details_adapter_getter_no_ui_side_effects' ($txtCidr.Text -eq '198.51.100.0/28' -and $lblScanStatus.Text -eq 'Previous result')\n        # Exercise the literal physical-workflow validator with isolated synthetic evidence.\n        # This is not a physical GUI/LAN run; no physical result is inferred from these fixtures.\n        $workflowText=[IO.File]::ReadAllText((Join-Path $Root '.github/workflows/ui-e2e-selfhosted.yml'))\n        $stageLines=New-Object System.Collections.Generic.List[string];$inStage=$false;$inRun=$false\n        foreach($line in ($workflowText -split \"`r?`n\")){\n            if($line -eq '      - name: Stage safe evidence and assert required physical gates'){$inStage=$true;continue}\n            if($inStage -and $line -match '^      - '){break}\n            if($inStage -and $line -eq '        run: |'){$inRun=$true;continue}\n            if($inRun -and $line.StartsWith('          ')){[void]$stageLines.Add($line.Substring(10))}\n        }\n        if($stageLines.Count -lt 20){throw 'Physical evidence validator extraction failed'}\n        $stage=[scriptblock]::Create(($stageLines.ToArray() -join \"`n\"))\n        $gateRoot=Join-Path $env:TEMP ('RFT-measurement-validator-'+[guid]::NewGuid().ToString('N'))\n        try {\n            [void](New-Item -ItemType Directory -Path (Join-Path $gateRoot 'real-machine-results'),(Join-Path $gateRoot 'ci-artifacts') -Force)\n            $gateRevision='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'\n            $gateNames=@('measurement_correctness','interactive_gui_e2e','deep_ui_e2e','route_scope_planner','route_scope_live','real_lan_fast_balanced','machine_cleanliness_baseline','machine_cleanliness_post')\n            $gateSummary=[ordered]@{sourceRevision=$gateRevision;mode='Full';pass=18;fail=0;skip=0;results=@($gateNames|ForEach-Object{[pscustomobject]@{name=$_;status='PASS'}})}\n            $gateSummary|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $gateRoot 'real-machine-results/summary.json') -Encoding UTF8\n            @{status='PASS';stage='completed';workerCompleted=$true;workerSucceeded=$true;lastPhase='Completed';lastError=''}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $gateRoot 'ci-artifacts/deep-ui-e2e.json') -Encoding UTF8\n            'fixture tabs'|Set-Content -LiteralPath (Join-Path $gateRoot 'ci-artifacts/ui-tab-items.txt')\n            '{}'|Set-Content -LiteralPath (Join-Path $gateRoot 'ci-artifacts/route-aware-live-summary.json')\n            $verifiedChecks=$checks.ToArray()\n            foreach($case in @('valid','wrong-revision','empty-checks','contradictory-status','failed-detail')){\n                $gateMeasurement=[ordered]@{status='PASS';fail=0;sourceRevision=$gateRevision;checks=$verifiedChecks}\n                if($case -eq 'wrong-revision'){$gateMeasurement.sourceRevision='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'}\n                if($case -eq 'empty-checks'){$gateMeasurement.checks=@()}\n                if($case -eq 'contradictory-status'){$gateMeasurement.status='FAIL'}\n                if($case -eq 'failed-detail'){$gateMeasurement.checks=@($verifiedChecks)+@([pscustomobject]@{name='fixture-failure';pass=$false})}\n                $gateMeasurement|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $gateRoot 'ci-artifacts/measurement-correctness.json') -Encoding UTF8\n                $accepted=$true;$gateError=''\n                Push-Location $gateRoot\n                try {\n                    & {function git {param($verb,$arg) $global:LASTEXITCODE=0;return 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'};& $stage 6>$null}\n                } catch {$accepted=$false;$gateError=$_.Exception.Message}\n                finally {Pop-Location}\n                Check ('physical_validator_fixture_'+$case) ($accepted -eq ($case -eq 'valid'))\n                if($case -eq 'valid' -and -not $accepted){Write-Host $gateError}\n            }\n        } finally {Remove-Item -LiteralPath $gateRoot -Recurse -Force}"],["            Check ('real_grid_scroll_policy_'+$scale) ($grid.ScrollBars -eq 'Both' -and $grid.Columns['MonTarget'].Frozen)","            Check ('real_grid_scroll_policy_'+$scale) ($grid.ScrollBars -eq 'Both' -and $grid.Columns['MonTarget'].Frozen)\n            Check ('real_grid_engine_error_fits_'+$scale) ($grid.Columns['MonState'].Width -ge ([Windows.Forms.TextRenderer]::MeasureText('ENGINE ERROR',$grid.Font).Width+20))"]]}]''')
          preparer=Path('.rft-preflight/prepare.py')
          metadata=preparer.read_text(encoding='utf-8')
          expected={}
          for fix in fixes:
              path=Path(fix['path']);data=path.read_bytes()
              assert hashlib.sha256(data).hexdigest()==fix['before'],fix['path']
              text=data.decode('utf-8')
              for old,new in fix['replacements']:
                  assert old in text,fix['path']
                  text=text.replace(old,new)
              data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==fix['after'],fix['path']
              path.write_bytes(data)
              expected[fix['path']]=fix['after']
          old="expected_after=fixmap[name]['after'] if name in fixmap else item['after']"
          assert metadata.count(old)==1
          metadata=metadata.replace(old,"expected_after="+repr(expected)+".get(name,fixmap[name]['after'] if name in fixmap else item['after'])")
          preparer.write_text(metadata,encoding='utf-8')
          print('REFINEMENTS_HASH_VERIFIED')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native production-function and real-control regression tests
        shell: powershell
        run: .\tests\WINDOWS_MEASUREMENT_TEST_v1_5_3.ps1
      - name: Windows PowerShell integration including real worker terminal paths
        shell: powershell
        run: .\tests\WINDOWS_INTEGRATION_TEST_v1_4_2.ps1
      - name: Existing static contracts
        shell: powershell
        run: |
          python tests/run_all_static_v1_4_2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pinned analyzer and unchanged lint budget
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          .\tests\WINDOWS_LINT_GATE_v1_4_2.ps1
      - name: Store only verified content blobs without changing branches or releases
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .rft-preflight/prepare.py publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: measurement-preflight-evidence
          path: |
            ci-artifacts/**
            logs/**
          if-no-files-found: warn
